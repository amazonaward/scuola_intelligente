<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Zainetto · Admin</title>
<style>
  :root { --bg:#f4f6fc; --s:#fff; --ink:#1c2333; --mu:#5b6475; --line:#e2e7f0; --ac:#4f46e5; --ac2:#ff7a59; --soft:#eef0ff; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:linear-gradient(120deg,#4f46e5,#7c3aed); color:#fff; padding:18px 24px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:20px; flex:1; }
  header a { color:#fff; opacity:.85; font-size:14px; }
  main { max-width:1150px; margin:0 auto; padding:22px 18px 60px; }
  .card { background:var(--s); border-radius:16px; box-shadow:0 1px 2px rgba(20,30,60,.04),0 6px 22px rgba(20,30,60,.07); padding:18px 20px; margin-bottom:18px; }
  .login { max-width:380px; margin:60px auto; text-align:center; }
  input, select, button { font:inherit; border-radius:10px; border:1px solid var(--line); padding:9px 12px; }
  input { width:100%; margin:10px 0; }
  button { background:var(--ac); color:#fff; border:0; cursor:pointer; font-weight:600; }
  button.ghost { background:var(--soft); color:var(--ac); }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
  .bar .sp { flex:1; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px; margin-bottom:18px; }
  .kpi { background:var(--s); border-radius:16px; padding:16px 18px; box-shadow:0 1px 2px rgba(20,30,60,.04),0 6px 22px rgba(20,30,60,.07); }
  .kpi b { display:block; font-size:28px; letter-spacing:-.5px; }
  .kpi span { color:var(--mu); font-size:13px; }
  h2 { font-size:16px; margin:0 0 12px; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:18px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:7px 6px; border-bottom:1px solid var(--line); }
  th { color:var(--mu); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  td.n { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .hb { height:8px; border-radius:4px; background:var(--ac); opacity:.75; }
  .muted { color:var(--mu); font-size:13px; }
  .err { color:#dc2626; margin-top:8px; }
  .chart svg { width:100%; height:auto; display:block; }
  .legend { display:flex; gap:16px; font-size:13px; color:var(--mu); margin-top:6px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
  .scroll { max-height:420px; overflow:auto; }
  code { background:var(--soft); padding:1px 5px; border-radius:5px; }
</style>
</head>
<body>
<header><h1>🎒 Zainetto · Pannello admin</h1><a href="./">← torna al sito</a></header>
<main id="app"></main>
<script src="data/curriculum.js"></script>
<script>
(function () {
  const app = document.getElementById('app');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const KEY = 'zainetto-admin';
  let key = sessionStorage.getItem(KEY) || '', days = 30, data = null;

  // titoli delle lezioni
  const titles = {};
  (function walk(o) { if (Array.isArray(o)) { if (typeof o[0] === 'string' && typeof o[1] === 'string' && /^[pm]\d-/.test(o[0])) titles[o[0]] = o[1]; else o.forEach(walk); } else if (o && typeof o === 'object') Object.values(o).forEach(walk); })((window.CURRICULUM || {}).program);
  const SECT = { t: 'Lezioni', home: 'Home', programma: 'Programma', metodi: 'Matematica dal mondo', libreria: 'Come funziona', coding: 'Coding', luoghi: 'Storia dei luoghi', spazio: 'Spazio', profili: 'Profili', contatti: 'Contatti', storico: 'Storico' };
  const CC = (() => { try { const dn = new Intl.DisplayNames(['it'], { type: 'region' }); return c => c === 'xx' ? 'Sconosciuto' : (dn.of(c.toUpperCase()) || c); } catch (e) { return c => c.toUpperCase(); } })();
  const DEV = { d: '🖥️ Computer', m: '📱 Telefono', t: '📲 Tablet' };
  const LANG = { it: 'Italiano', en: 'Inglese', fr: 'Francese', ru: 'Russo', ro: 'Rumeno' };
  function pageName(k) {
    if (k.startsWith('t/')) { const id = k.slice(2); return (titles[id] || id) + ' <span class="muted">' + esc(id.slice(0, 2).toUpperCase()) + '</span>'; }
    const [s, x] = k.split('/');
    return esc((SECT[s] || s) + (x ? ' · ' + x.replace(/-/g, ' ') : ''));
  }
  const dur = s => { s = Math.round(s); if (s < 60) return s + ' s'; const m = Math.floor(s / 60); if (m < 60) return m + ' min ' + (s % 60 ? (s % 60) + ' s' : ''); const h = Math.floor(m / 60); return h + ' h ' + (m % 60) + ' min'; };
  const num = n => n.toLocaleString('it-IT');

  function login(msg) {
    app.innerHTML = `<div class="card login"><h2>Accesso admin</h2><p class="muted">Inserisci la password del pannello.</p>
      <form id="f"><input type="password" id="pw" placeholder="Password" autocomplete="current-password" required><button>Entra</button></form>
      ${msg ? `<div class="err">${esc(msg)}</div>` : ''}</div>`;
    document.getElementById('f').onsubmit = e => { e.preventDefault(); key = document.getElementById('pw').value; load(); };
    document.getElementById('pw').focus();
  }

  async function load() {
    app.innerHTML = '<div class="card">Caricamento…</div>';
    let r;
    try { r = await fetch('api/stats?days=' + days, { headers: { 'x-admin-key': key }, cache: 'no-store' }); }
    catch (e) { return login('Impossibile contattare il server.'); }
    let j = null; try { j = await r.json(); } catch (e) {}
    if (r.status === 401) { sessionStorage.removeItem(KEY); return login('Password errata.'); }
    if (!r.ok) return login((j && j.error) || ('Errore ' + r.status + ': il pannello funziona solo sul sito pubblicato su Vercel.'));
    sessionStorage.setItem(KEY, key); data = j; render();
  }

  function tally(list, f, w) { const m = new Map(); list.forEach(x => { const k = f(x); m.set(k, (m.get(k) || 0) + (w ? w(x) : 1)); }); return [...m.entries()].sort((a, b) => b[1] - a[1]); }
  function table(rows, head, fmt) {
    const max = Math.max(1, ...rows.map(r => r[1]));
    return `<table><tr><th>${head[0]}</th><th></th><th style="text-align:right">${head[1]}</th></tr>${rows.map(r =>
      `<tr><td>${r[0]}</td><td style="width:30%"><div class="hb" style="width:${(r[1] / max * 100).toFixed(1)}%"></div></td><td class="n">${fmt ? fmt(r[1]) : num(r[1])}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">Nessun dato</td></tr>'}</table>`;
  }

  function chart(ds) {
    const W = 1000, H = 230, P = 34, n = ds.length, bw = (W - P * 2) / n;
    const maxV = Math.max(1, ...ds.map(d => d.visitors)), maxS = Math.max(1, ...ds.map(d => d.sessions));
    const max = Math.max(maxV, maxS);
    const y = v => H - 26 - v / max * (H - 50);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Visitatori al giorno">`;
    for (let i = 0; i <= 4; i++) { const v = Math.round(max * i / 4), yy = y(v); s += `<line x1="${P}" x2="${W - 8}" y1="${yy}" y2="${yy}" stroke="#e2e7f0"/><text x="${P - 6}" y="${yy + 4}" font-size="11" text-anchor="end" fill="#5b6475">${v}</text>`; }
    ds.forEach((d, i) => {
      const x = P + i * bw;
      s += `<rect x="${x + bw * .12}" y="${y(d.sessions)}" width="${bw * .76}" height="${H - 26 - y(d.sessions)}" rx="3" fill="#c7c4fb"><title>${d.day}: ${d.sessions} sessioni</title></rect>`;
      s += `<rect x="${x + bw * .27}" y="${y(d.visitors)}" width="${bw * .46}" height="${H - 26 - y(d.visitors)}" rx="3" fill="#4f46e5"><title>${d.day}: ${d.visitors} visitatori, ${dur(d.sec)}</title></rect>`;
      if (n <= 14 || i % Math.ceil(n / 10) === 0) s += `<text x="${x + bw / 2}" y="${H - 8}" font-size="11" text-anchor="middle" fill="#5b6475">${d.day.slice(8)}/${d.day.slice(5, 7)}</text>`;
    });
    return s + '</svg>';
  }

  function render() {
    const S = data.sessions, ds = data.days;
    const vis = new Set(S.map(s => s.vid)).size, tot = S.reduce((a, s) => a + s.sec, 0);
    const today = ds[ds.length - 1] || { visitors: 0, sessions: 0 };
    const perVis = tally(S, s => s.vid, s => s.sec);
    const ret = tally(S, s => s.vid).filter(x => x[1] > 1).length;
    const pages = new Map(); S.forEach(s => s.pages.forEach(([k, c]) => pages.set(k, (pages.get(k) || 0) + c)));
    const pageRows = [...pages.entries()].sort((a, b) => b[1] - a[1]).slice(0, 25).map(([k, c]) => [pageName(k), c]);
    const lessons = [...pages.entries()].filter(([k]) => k.startsWith('t/'));
    const sect = tally(S.flatMap(s => s.pages.map(([k, c]) => [k.split('/')[0], c])), x => SECT[x[0]] || x[0], x => x[1]);
    const recent = S.slice().sort((a, b) => String(b.at).localeCompare(String(a.at))).slice(0, 60);

    app.innerHTML = `
      <div class="bar"><b>Periodo:</b>
        <select id="days">${[1, 7, 14, 30, 60, 90].map(d => `<option value="${d}" ${d === days ? 'selected' : ''}>${d === 1 ? 'Oggi' : 'Ultimi ' + d + ' giorni'}</option>`).join('')}</select>
        <span class="sp"></span><button class="ghost" id="re">↻ Aggiorna</button><button class="ghost" id="out">Esci</button></div>
      <div class="kpis">
        <div class="kpi"><b>${num(vis)}</b><span>visitatori unici</span></div>
        <div class="kpi"><b>${num(S.length)}</b><span>visite (sessioni)</span></div>
        <div class="kpi"><b>${dur(tot)}</b><span>tempo totale sul sito</span></div>
        <div class="kpi"><b>${dur(S.length ? tot / S.length : 0)}</b><span>durata media di una visita</span></div>
        <div class="kpi"><b>${dur(vis ? tot / vis : 0)}</b><span>tempo medio per visitatore</span></div>
        <div class="kpi"><b>${num(ret)}</b><span>visitatori tornati più volte</span></div>
        <div class="kpi"><b>${num(today.visitors)}</b><span>visitatori oggi (${num(today.sessions)} visite)</span></div>
        <div class="kpi"><b>${num(lessons.length)}</b><span>lezioni diverse aperte</span></div>
      </div>
      <div class="card chart"><h2>Visitatori e visite al giorno</h2>${chart(ds)}
        <div class="legend"><span><i style="background:#4f46e5"></i>visitatori unici</span><span><i style="background:#c7c4fb"></i>visite</span></div></div>
      <div class="grid2">
        <div class="card"><h2>Pagine e lezioni più aperte</h2><div class="scroll">${table(pageRows, ['Pagina', 'Aperture'])}</div></div>
        <div class="card"><h2>Sezioni</h2>${table(sect.slice(0, 12), ['Sezione', 'Aperture'])}
          <h2 style="margin-top:18px">Durata delle visite</h2>${table(buckets(S), ['Durata', 'Visite'])}</div>
        <div class="card"><h2>Paesi</h2>${table(tally(S, s => CC(s.cc)).slice(0, 15), ['Paese', 'Visite'])}</div>
        <div class="card"><h2>Dispositivi</h2>${table(tally(S, s => DEV[s.dev] || s.dev), ['Dispositivo', 'Visite'])}
          <h2 style="margin-top:18px">Lingua scelta</h2>${table(tally(S, s => LANG[s.lang] || s.lang), ['Lingua', 'Visite'])}</div>
      </div>
      <div class="card"><h2>Visitatori (codice anonimo) e tempo totale</h2><div class="scroll">${table(perVis.slice(0, 50).map(([v, sec]) => ['<code>' + esc(v.slice(0, 8)) + '</code> · ' + S.filter(s => s.vid === v).length + ' visite', sec]), ['Visitatore', 'Tempo'], dur)}</div></div>
      <div class="card"><h2>Ultime visite</h2><div class="scroll"><table><tr><th>Quando</th><th>Visitatore</th><th>Paese</th><th>Dispositivo</th><th style="text-align:right">Durata</th><th>Pagine</th></tr>
        ${recent.map(s => `<tr><td>${s.at ? new Date(s.at).toLocaleString('it-IT', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : s.day}</td><td><code>${esc(s.vid.slice(0, 8))}</code></td><td>${esc(CC(s.cc))}</td><td>${DEV[s.dev] || ''}</td><td class="n">${dur(s.sec)}</td><td class="muted">${s.pages.slice(0, 3).map(([k]) => pageName(k)).join(', ')}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">Ancora nessuna visita registrata.</td></tr>'}</table></div></div>
      <p class="muted">Dati anonimi: ogni dispositivo ha un codice casuale; non vengono salvati nomi dei profili né indirizzi IP (solo il Paese). Il tempo conta solo quando la pagina è aperta e visibile. Chi usa la protezione “Do Not Track” non viene contato.</p>`;
    document.getElementById('days').onchange = e => { days = +e.target.value; load(); };
    document.getElementById('re').onclick = load;
    document.getElementById('out').onclick = () => { sessionStorage.removeItem(KEY); key = ''; login(); };
  }
  function buckets(S) {
    const B = [['meno di 1 min', 60], ['1–5 min', 300], ['5–15 min', 900], ['15–30 min', 1800], ['30–60 min', 3600], ['più di 1 ora', 1e9]];
    return B.map(([l, max], i) => [l, S.filter(s => s.sec < max && s.sec >= (i ? B[i - 1][1] : 0)).length]);
  }
  key ? load() : login();
})();
</script>
</body>
</html>
